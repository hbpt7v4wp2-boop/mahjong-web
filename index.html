
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>麻雀 Web Game</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #173d30;
      color: white;
      font-family: sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
    }

    button {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #173d30;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      min-height: 24px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main>
    <h1>麻雀 Web Game</h1>
    <p>動作確認 Version 0.1</p>

    <button id="testButton">
      動作テスト
    </button>

    <p id="result"></p>
  </main>

  <script>
    const button =
      document.getElementById("testButton");

    const result =
      document.getElementById("result");

    button.addEventListener("click", () => {
      result.textContent =
        "JavaScriptが正常に動作しています！";
    });
  </script>
</body>
</html>
