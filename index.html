
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>麻雀 Web Game</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: 16px;
      font-family: system-ui, sans-serif;
      background: #173d30;
      color: white;
    }

    main {
      max-width: 680px;
      margin: auto;
    }

    h1, .subtitle {
      text-align: center;
    }

    section {
      margin: 16px 0;
      padding: 18px;
      background: #245441;
      border-radius: 12px;
    }

    input, button {
      font: inherit;
      padding: 12px;
      border: 0;
      border-radius: 8px;
    }

    input {
      min-width: 0;
      width: 100%;
    }

    button {
      background: white;
      color: #173d30;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: default;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 9px;
    }

    .row input { flex: 1; }
    .row button { flex: none; }

    label {
      display: block;
      margin-top: 12px;
    }

    #roomCode {
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #roster {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .seat {
      background: #133e2f;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .seat small {
      color: #c3e3d2;
    }

    #status {
      font-weight: bold;
    }

    #log {
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
      background: #102c22;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #log div {
      margin: 4px 0;
    }

    #invite {
      overflow-wrap: anywhere;
      color: #b9f5d1;
    }

    [hidden] {
      display: none !important;
    }

    @media(max-width: 410px) {
      .row { flex-wrap: wrap; }
      .row input { flex-basis: 100%; }
    }
    
    #handArea {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 16px 0;
    }

    .tile {
      min-width: 38px;
      min-height: 54px;
      padding: 5px;
      background: #fff7e7;
      color: #143428;
      border: 2px solid #d7d0bd;
      border-radius: 5px;
      font-size: 14px;
    }

    .tile.red {
      color: #c62828;
    }

    .tile.selected {
      transform: translateY(-7px);
      border-color: #e6bd4c;
    }

    .discardRow {
      background: #133e2f;
      padding: 10px;
      border-radius: 7px;
      margin: 8px 0;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }

  </style>
</head>

<body>
<main>
  <h1>麻雀 Web Game</h1>
  <p class="subtitle">待機ルーム Version 0.6</p>


  <section>
    <h2>ルームに参加</h2>

    <label for="nickname">
      プレイヤー名（12文字まで）
    </label>
    <input
      id="nickname"
      maxlength="12"
      placeholder="名前を入力"
    >

    <label for="roomCode">
      部屋コード（6文字）
    </label>
    <div class="row">
      <input
        id="roomCode"
        maxlength="6"
        placeholder="ABC123"
        autocapitalize="characters"
      >
      <button id="makeCode">自動作成</button>
    </div>

    <div class="row">
      <button id="connect">参加する</button>
      <button id="disconnect" disabled>退出</button>
    </div>

    <p id="inviteWrap" hidden>
      招待リンク：<a id="invite"></a>
    </p>
    <p id="status">未接続</p>
  </section>

  <section>
    <h2>
      待機ルーム <span id="count">0/3</span>
    </h2>

    <div id="roster"></div>

    <div class="row">
      <button id="ready" disabled>
        準備完了にする
      </button>
      
      <button id="com" disabled>
        COMを追加
      </button>

      <button id="start" disabled>
        対局開始テスト
      </button>
    </div>

    <p id="hint">
      3人が揃うまで対局を開始できません。
    </p>
  </section>


  <section id="gameArea" hidden>
    <h2>東1局・対局テスト</h2>

    <p id="gameInfo"></p>

    <h3>各プレイヤーの捨て牌</h3>
    <div id="discardArea"></div>

    <h3>あなたの手牌</h3>
    <div id="handArea"></div>

    <p id="gameHint"></p>
  </section>


  <section>
    <h2>チャット</h2>
    <div id="log" aria-live="polite"></div>

    <form id="sendForm" class="row">
      <input
        id="message"
        maxlength="100"
        placeholder="メッセージを入力"
        disabled
      >
      <button id="send" type="submit" disabled>
        送信
      </button>
    </form>
  </section>
</main>

<script>
  const SERVER =
    "wss://mahjong-realtime-test.hbpt7v4wp2.workers.dev";

  const $ = id => document.getElementById(id);
  let socket = null;
  let connecting = false;
  let joined = false;
  let roomState = {
    selfSeat: null,
    players: []
  };

  const status = message => {
    $("status").textContent = message;
  };

  function log(message) {
    const div = document.createElement("div");
    div.textContent = message;
    $("log").appendChild(div);
    $("log").scrollTop = $("log").scrollHeight;
  }

  const roomCode = () =>
    $("roomCode").value.trim().toUpperCase();

  const send = payload => {
    if (socket?.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(payload));
    }
  };


  let gameState = null;
  let selectedTileId = null;
  let discardPending = false;

  function tileText(tile) {
    const honors = {
      E: "東", S: "南", W: "西",
      N: "北", H: "白", F: "發", C: "中"
    };

    if (honors[tile.code]) {
      return honors[tile.code];
    }

    const suit = {
      m: "萬", p: "筒", s: "索"
    }[tile.code[1]];

    return (
      (tile.red ? "赤" : "") +
      tile.code[0] +
      suit
    );
  }

  function tileSort(tile) {
    if (tile.code.length === 2) {
      const base = {
        m: 0, p: 10, s: 20
      }[tile.code[1]];

      return base + Number(tile.code[0]);
    }

    return 40 + [
      "E", "S", "W", "N", "H", "F", "C"
    ].indexOf(tile.code);
  }

  function renderGame() {
    const g = gameState;
    $("gameArea").hidden = !g;

    if (!g) return;

    const playing = g.phase === "playing";
    const myTurn =
      playing &&
      g.mySeat === g.turnSeat &&
      !discardPending;

    $("gameInfo").textContent = playing
      ? `残り山牌：${g.remaining}枚 / ` +
        `${g.turnSeat}番席の手番`
      : "山牌がなくなりました。テスト対局終了。";

    $("discardArea").replaceChildren();

    g.players.forEach((player, index) => {
      const row = document.createElement("div");
      row.className = "discardRow";

      const tiles = g.discards[index]
        .map(tileText).join(" ");

      row.textContent =
        `${index + 1}番席 ${player.name}：` +
        (tiles || "捨て牌なし");

      $("discardArea").append(row);
    });

    $("handArea").replaceChildren();

    const sorted = [...g.hand].sort(
      (a, b) => tileSort(a) - tileSort(b)
    );

    for (const tile of sorted) {
      const button =
        document.createElement("button");

      button.type = "button";
      button.className =
        "tile" +
        (tile.red ? " red" : "") +
        (selectedTileId === tile.id
          ? " selected" : "");

      button.textContent = tileText(tile);
      button.disabled = !myTurn;

      button.onclick = () => {
        if (selectedTileId === tile.id) {
          discardPending = true;
          selectedTileId = null;

          send({
            type: "discard",
            tileId: tile.id,
            actionId: g.actionId
          });
        } else {
          selectedTileId = tile.id;
        }

        renderGame();
      };

      $("handArea").append(button);
    }

    $("gameHint").textContent = !playing
      ? "全員が揃っていれば再び開始テストができます。"
      : myTurn
        ? selectedTileId
          ? "同じ牌をもう一度押すと打牌します。"
          : "あなたの手番です。牌を選択してください。"
        : "相手の操作を待っています。";
  }


  function refreshUI() {
    const active = connecting || joined;

    for (const id of [
      "nickname",
      "roomCode",
      "makeCode",
      "connect"
    ]) {
      $(id).disabled = active;
    }

    $("disconnect").disabled = !active;
    $("message").disabled = !joined;
    $("send").disabled = !joined;

    const me = roomState.players.find(
      p => p.seat === roomState.selfSeat
    );


    $("ready").disabled =
      !joined || gameState?.phase === "playing";

    $("ready").textContent = me?.ready
      ? "準備を取り消す"
      : "準備完了にする";
      
      
    const hasCom = roomState.players.some(
      p => p.com === true
    );

    const humanCount = roomState.players.filter(
      p => !p.com
    ).length;

    
    $("com").disabled =
      !joined ||
      !me?.host ||
      gameState?.phase === "playing" ||
      (!hasCom && humanCount !== 2);


    $("com").textContent =
      hasCom ? "COMを外す" : "COMを追加";


    const canStart =
      joined &&
      me?.host &&
      roomState.players.length === 3 &&

      roomState.players.every(
        p => p.host || p.ready
      );



    $("start").disabled =
      !canStart || gameState?.phase === "playing";


    $("count").textContent =
      roomState.players.length + "/3";

    $("hint").textContent = canStart
      ? "開始条件を満たしています（まだ対局は始まりません）。"
      : "3人全員が参加して準備完了すると、部屋主が開始できます。";

    $("roster").replaceChildren();

    for (let seat = 1; seat <= 3; seat++) {
      const player = roomState.players.find(
        p => p.seat === seat
      );

      const item = document.createElement("div");
      item.className = "seat";

      const left = document.createElement("span");
      left.textContent = player
        ? `${seat}番席：${player.name}` +
          `${player.host ? " 👑部屋主" : ""}` +
          `${roomState.selfSeat === seat ? "（あなた）" : ""}`
        : `${seat}番席：空席`;

      const right = document.createElement("small");
      right.textContent = player
        ? player.ready ? "準備完了" : "準備中"
        : "参加待ち";

      item.append(left, right);
      $("roster").append(item);
    }
  }

  function updateInvite() {
    const code = roomCode();
    $("inviteWrap").hidden =
      !/^[A-Z0-9]{6}$/.test(code);

    if (!$("inviteWrap").hidden) {
      const url = new URL(location.href);
      url.search = "";
      url.searchParams.set("room", code);

      $("invite").href = url.href;
      $("invite").textContent = url.href;
    }
  }

  $("makeCode").onclick = () => {
    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    const bytes = crypto.getRandomValues(
      new Uint8Array(6)
    );

    $("roomCode").value = [...bytes]
      .map(v => chars[v % chars.length])
      .join("");

    updateInvite();
  };

  $("roomCode").oninput = updateInvite;

  $("roomCode").value =
    (
      new URLSearchParams(location.search)
        .get("room") || ""
    ).toUpperCase().slice(0, 6);

  try {
    $("nickname").value =
      localStorage.getItem("mahjong.nickname") || "";
  } catch {}

  updateInvite();
  refreshUI();

  $("connect").onclick = () => {
    const code = roomCode();
    const name = $("nickname").value.trim();

    if (
      !/^[A-Z0-9]{6}$/.test(code) ||
      !name ||
      name.length > 12
    ) {
      status(
        "名前と6文字の部屋コードを確認してください"
      );
      return;
    }

    let id;

    try {
      id = localStorage.getItem(
        "mahjong.player." + code
      );
    } catch {}

    if (
      !id ||
      !/^[0-9a-f-]{36}$/i.test(id)
    ) {
      id = crypto.randomUUID();

      try {
        localStorage.setItem(
          "mahjong.player." + code,
          id
        );
      } catch {}
    }

    try {
      localStorage.setItem(
        "mahjong.nickname",
        name
      );
    } catch {}

    connecting = true;
    status("接続中...");
    refreshUI();

    try {
      socket = new WebSocket(
        SERVER + "/room/" + code
      );
    } catch {
      connecting = false;
      refreshUI();
      status("接続を開始できませんでした");
      return;
    }

    const current = socket;

    current.onopen = () => {
      send({ type: "join", id, name });
    };

    current.onmessage = event => {
      let packet;

      try {
        packet = JSON.parse(event.data);
      } catch {
        return;
      }

      if (packet.type === "state") {
        connecting = false;
        joined = true;
        roomState = packet;
        status("接続成功！");
        refreshUI();


      } else if (packet.type === "game") {
        gameState = packet;
        selectedTileId = null;
        discardPending = false;

        renderGame();
        refreshUI();



      } else if (packet.type === "chat") {
        log(packet.name + "：" + packet.text);

      } else if (packet.type === "notice") {
        log("お知らせ：" + packet.text);
        status(packet.text);
      }
    };

    current.onerror = () => {
      status("通信エラーが発生しました");
    };

current.onclose = (event) => {

      if (socket !== current) return;

      connecting = false;
      joined = false;
      socket = null;
      roomState = {
        selfSeat: null,
        players: []
      };

      
      gameState = null;
      selectedTileId = null;
      discardPending = false;

      renderGame();
      refreshUI();

      
      const detail =
        `code=${event.code}, ` +
        `wasClean=${event.wasClean}`;

      status("切断されました：" + detail);
      log("通信診断：" + detail);


    };
  };

  $("disconnect").onclick = () => {
    socket?.close(1000, "Leave");
  };

  $("ready").onclick = () => {
    const me = roomState.players.find(
      p => p.seat === roomState.selfSeat
    );
    
    
    $("ready").hidden = !joined || !!me?.host;
    $("com").hidden = !joined || !me?.host;
    $("start").hidden = !joined || !me?.host;


    if (me) {
      send({
        type: "ready",
        ready: !me.ready
      });
    }
  };


  $("com").onclick = () => {
    const hasCom = roomState.players.some(
      p => p.com === true
    );

    send({
      type: "com",
      enabled: !hasCom
    });
  };


  $("start").onclick = () => {
    send({ type: "start" });
  };

  $("sendForm").onsubmit = event => {
    event.preventDefault();

    const text = $("message").value.trim();

    if (text && joined) {
      send({
        type: "chat",
        text
      });
      $("message").value = "";
    }
  };
</script>
</body>
</html>
